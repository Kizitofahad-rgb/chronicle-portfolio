kind = "web"
previewPath = "/"
title = "Kizito Fahad — Chronicle"
description = "A cinematic personal portfolio for Kizito Fahad, combining an animated game-inspired interface with quests, achievements, certificates, and contact paths for collaborators and recruiters."
version = "1.0.0"
id = "artifacts/chronicle-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20816

[services.development]
run = "pnpm --filter @workspace/chronicle-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chronicle-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/chronicle-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20816"
BASE_PATH = "/"
